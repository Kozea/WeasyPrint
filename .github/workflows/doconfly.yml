name: doconfly
on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  doconfly:
    name: doconfly job
    runs-on: ubuntu-latest
    env:
      PASSWORD: ${{ secrets.DOCONFLY_PASSWORD }}
    steps:
      - run: |
          curl --user "doconfly:$PASSWORD" "https://doconfly.courtbouillon.org/$GITHUB_REPOSITORY/$GITHUB_REF"
